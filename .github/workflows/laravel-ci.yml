name: Validacion de Codigo (CI)

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  auditoria:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Descargar código fuente
      uses: actions/checkout@v3

    - name: ⚙️ Configurar PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        
    - name: 📦 Validar instalación de dependencias
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: 🔍 Auditoría de Sintaxis PHP (Linting)
      # Esto revisará que Raquel o Jybran no hayan olvidado un punto y coma o cerrado mal una llave
      run: find app/ -name "*.php" -print0 | xargs -0 -n1 php -l